<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bootstrap Grid</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <div class="row">
      <div class="col-md-4 col-sm">Row1 col1</div>
      <div class="col-md-8 col-sm">Row1 col2</div>
    </div>

    <div class="row justify-content-between">
      <div class="col-md-4 offset-md-2">Row2 col1</div>
      <div class="col-md-4">Row2 col2</div>
    </div>

    <div class="row justify-content-center">
      <div class="col-md-4 col-sm-6">Row3 col1</div>
      <div class="col-md-4 col-sm-6">Row3 col2</div>
    </div>
  </div>
</body>
</html>
